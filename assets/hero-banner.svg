<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.2)"/>
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.4)"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.05)"/>
    </linearGradient>
    <radialGradient id="aurora-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.08)"/>
      <stop offset="100%" stop-color="rgba(8, 11, 20, 0)"/>
    </radialGradient>
    
    <!-- Filter for Glow -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes driftWave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300px); }
    }
    .pulsing-node { animation: pulseGlow 4s ease-in-out infinite; }
    .floating-star { animation: floatParticle 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif; font-weight: 800; }
    .code-text { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Radial Aurora Lighting -->
  <circle cx="600" cy="180" r="420" fill="url(#aurora-glow)"/>

  <!-- Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6"/>
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Constellation Network Nodes & Links -->
  <g opacity="0.6">
    <line x1="160" y1="110" x2="280" y2="80" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="280" y1="80" x2="380" y2="150" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="380" y1="150" x2="240" y2="210" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="240" y1="210" x2="160" y2="110" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <line x1="860" y1="90" x2="980" y2="140" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="980" y1="140" x2="1080" y2="80" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="980" y1="140" x2="940" y2="230" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="940" y1="230" x2="1060" y2="260" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Left Constellation Nodes -->
    <circle cx="160" cy="110" r="4.5" fill="#38BDF8" class="pulsing-node"/>
    <circle cx="280" cy="80" r="5" fill="#818CF8" class="pulsing-node" style="animation-delay: 1s;"/>
    <circle cx="380" cy="150" r="4" fill="#C084FC" class="pulsing-node" style="animation-delay: 2s;"/>
    <circle cx="240" cy="210" r="5.5" fill="#38BDF8" class="pulsing-node" style="animation-delay: 1.5s;"/>

    <!-- Right Constellation Nodes -->
    <circle cx="860" cy="90" r="4" fill="#38BDF8" class="pulsing-node" style="animation-delay: 0.5s;"/>
    <circle cx="980" cy="140" r="6" fill="#818CF8" class="pulsing-node" style="animation-delay: 2.2s;"/>
    <circle cx="1080" cy="80" r="4.5" fill="#C084FC" class="pulsing-node" style="animation-delay: 1.8s;"/>
    <circle cx="940" cy="230" r="5" fill="#38BDF8" class="pulsing-node" style="animation-delay: 2.7s;"/>
    <circle cx="1060" cy="260" r="4" fill="#818CF8" class="pulsing-node" style="animation-delay: 1.1s;"/>
  </g>

  <!-- Center Decorative Glow Spot -->
  <circle cx="600" cy="140" r="90" fill="#38BDF8" opacity="0.1" filter="url(#glow-blur)"/>

  <!-- Top Pill: System Version & Architecture -->
  <g transform="translate(420, 36)">
    <rect width="360" height="34" rx="17" fill="url(#badge-grad)" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle cx="22" cy="17" r="4.5" fill="#10B981"/>
    <circle cx="22" cy="17" r="7.5" stroke="#10B981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="4.5;10;4.5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="22" fill="#E0F2FE" font-size="12" class="code-text" font-weight="600" letter-spacing="0.5">
      ENTERPRISE AGENTIC RAG • V4.2 ARCHITECTURE
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" fill="#FFFFFF" font-size="46" class="title-text" letter-spacing="-1">
    AI KNOWLEDGE WORKSPACE
  </text>
  <text x="600" y="195" text-anchor="middle" fill="url(#primary-glow)" font-size="28" class="title-text" font-weight="600" letter-spacing="-0.4">
    Autonomous Document Intelligence &amp; Generative Motion Studio
  </text>

  <!-- Tagline Description -->
  <text x="600" y="242" text-anchor="middle" fill="#94A3B8" font-size="15" class="title-text" font-weight="400">
    Hybrid Dense-Sparse RAG (384-d MiniLM + BM25) • Reciprocal Rank Fusion • Multi-Agent Intent Routing
  </text>
  <text x="600" y="268" text-anchor="middle" fill="#64748B" font-size="14" class="title-text" font-weight="400">
    Pedagogical Explanations • Delta Policy Compare • Omni 60fps Video Loops • Native Audio Voice Briefings
  </text>

  <!-- Feature Tags / Metric Cards Bar -->
  <g transform="translate(110, 310)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="72" rx="12" fill="#0E1626" stroke="url(#card-border)" stroke-width="1"/>
      <text x="18" y="32" fill="#38BDF8" font-size="11" class="code-text" font-weight="600">ZERO HALLUCINATION</text>
      <text x="18" y="54" fill="#F1F5F9" font-size="15" class="title-text" font-weight="700">Strict Citations &amp; RRF</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(250, 0)">
      <rect width="220" height="72" rx="12" fill="#0E1626" stroke="url(#card-border)" stroke-width="1"/>
      <text x="18" y="32" fill="#818CF8" font-size="11" class="code-text" font-weight="600">INTELLIGENCE SUITE</text>
      <text x="18" y="54" fill="#F1F5F9" font-size="15" class="title-text" font-weight="700">5 Autonomous Agents</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(500, 0)">
      <rect width="220" height="72" rx="12" fill="#0E1626" stroke="url(#card-border)" stroke-width="1"/>
      <text x="18" y="32" fill="#C084FC" font-size="11" class="code-text" font-weight="600">VISUAL MOTION STUDIO</text>
      <text x="18" y="54" fill="#F1F5F9" font-size="15" class="title-text" font-weight="700">Omni Video &amp; Canvas</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(750, 0)">
      <rect width="230" height="72" rx="12" fill="#0E1626" stroke="url(#card-border)" stroke-width="1"/>
      <text x="18" y="32" fill="#34D399" font-size="11" class="code-text" font-weight="600">MULTI-FORMAT INGEST</text>
      <text x="18" y="54" fill="#F1F5F9" font-size="15" class="title-text" font-weight="700">PDF, DOCX, PPTX, CSV</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-glow)"/>
</svg>