<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)"/>
    </linearGradient>
    <linearGradient id="aurora-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="aurora-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif; }
  </style>

  <!-- Studio Frame -->
  <rect width="1000" height="520" rx="16" fill="url(#studio-bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Studio Bar -->
  <rect x="0" y="0" width="1000" height="54" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="28" cy="27" r="6" fill="#EF4444"/>
  <circle cx="48" cy="27" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="27" r="6" fill="#10B981"/>

  <text x="500" y="32" text-anchor="middle" fill="#E2E8F0" class="font-sans" font-size="14" font-weight="600">
    Visual Motion Studio &amp; AI Multimedia Engine • 60fps Real-Time Shaders
  </text>

  <!-- Left: Live Canvas Viewport -->
  <g transform="translate(30, 80)">
    <rect width="520" height="400" rx="12" fill="#030712" stroke="#334155" stroke-width="1.5"/>

    <!-- Simulated Aurora Silk Shader Waves -->
    <path d="M 0 200 Q 130 110, 260 180 T 520 140 L 520 400 L 0 400 Z" fill="url(#aurora-wave-1)" opacity="0.6"/>
    <path d="M 0 260 Q 150 190, 300 240 T 520 200 L 520 400 L 0 400 Z" fill="url(#aurora-wave-2)" opacity="0.5"/>

    <!-- Constellation Nodes & RRF Pulses -->
    <g opacity="0.85">
      <line x1="80" y1="90" x2="180" y2="130" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="180" y1="130" x2="310" y2="70" stroke="#818CF8" stroke-width="1.5"/>
      <line x1="310" y1="70" x2="420" y2="120" stroke="#C084FC" stroke-width="1.5"/>
      <line x1="180" y1="130" x2="260" y2="210" stroke="#38BDF8" stroke-width="1.5"/>

      <!-- Node Circles with Pulse -->
      <circle cx="80" cy="90" r="5" fill="#38BDF8"/>
      <circle cx="180" cy="130" r="6" fill="#818CF8"/>
      <circle cx="310" cy="70" r="7" fill="#C084FC"/>
      <circle cx="420" cy="120" r="5" fill="#38BDF8"/>
      <circle cx="260" cy="210" r="6.5" fill="#34D399"/>

      <!-- Traveling Data Packet on Edge -->
      <circle cx="245" cy="100" r="4" fill="#FFFFFF">
        <animate attributeName="cx" values="180;310;180" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="130;70;130" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Overlay Badge on Viewport -->
    <g transform="translate(18, 18)">
      <rect width="180" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10B981"/>
      <text x="26" y="18" fill="#F8FAFC" class="font-mono" font-size="11" font-weight="600">60 FPS VECTOR CANVAS</text>
    </g>
  </g>

  <!-- Right: Preset Selector & AI Generators -->
  <g transform="translate(580, 80)">
    <!-- Canvas Presets List -->
    <text x="0" y="16" fill="#94A3B8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">CANVAS ANIMATION PRESETS</text>

    <!-- Preset 1 -->
    <g transform="translate(0, 30)">
      <rect width="390" height="54" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="16" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">Omni Neural Constellation</text>
      <text x="16" y="42" fill="#94A3B8" class="font-sans" font-size="11">60fps dynamic semantic graph with cursor gravity</text>
      <circle cx="365" cy="27" r="7" fill="#38BDF8"/>
    </g>

    <!-- Preset 2 -->
    <g transform="translate(0, 95)">
      <rect width="390" height="54" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="600">Nano Banana Aurora Silk</text>
      <text x="16" y="42" fill="#64748B" class="font-sans" font-size="11">Multi-layer iridescent fluid ribbon shader</text>
    </g>

    <!-- Preset 3 -->
    <g transform="translate(0, 160)">
      <rect width="390" height="54" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="600">Vector Horizon Lattice</text>
      <text x="16" y="42" fill="#64748B" class="font-sans" font-size="11">Isometric perspective coordinate grid</text>
    </g>

    <!-- AI Generation Cards -->
    <text x="0" y="240" fill="#94A3B8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">AI GENERATIVE MULTIMEDIA CONTROLS</text>

    <!-- Nano Banana Button -->
    <g transform="translate(0, 255)">
      <rect width="390" height="60" rx="8" fill="url(#glow-card)" stroke="#818CF8" stroke-width="1.2"/>
      <text x="16" y="26" fill="#818CF8" class="font-mono" font-size="11" font-weight="700">GEMINI 3.1 FLASH-LITE-IMAGE</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">Generate Keyframe Still (16:9)</text>
      <text x="320" y="38" fill="#A78BFA" class="font-sans" font-size="12" font-weight="600">Generate ✦</text>
    </g>

    <!-- Omni Video Loop Button -->
    <g transform="translate(0, 330)">
      <rect width="390" height="60" rx="8" fill="url(#glow-card)" stroke="#C084FC" stroke-width="1.2"/>
      <text x="16" y="26" fill="#C084FC" class="font-mono" font-size="11" font-weight="700">GEMINI OMNI 1.1 FLASH VIDEO</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">Generate Motion Video Loop</text>
      <text x="320" y="38" fill="#F472B6" class="font-sans" font-size="12" font-weight="600">Synthesize ✦</text>
    </g>
  </g>
</svg>